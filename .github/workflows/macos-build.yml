name: macOS build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  vst3:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure Ninja is available
        run: command -v ninja >/dev/null || brew install ninja

      - name: Generate Metal shader headers
        shell: bash
        run: |
          git clone --depth 1 https://github.com/floooh/sokol-tools-bin.git /tmp/sokol-tools-bin
          if [[ "$(uname -m)" == "arm64" ]]; then
            SHDC=/tmp/sokol-tools-bin/bin/osx_arm64/sokol-shdc
          else
            SHDC=/tmp/sokol-tools-bin/bin/osx/sokol-shdc
          fi
          chmod +x "$SHDC"
          "$SHDC" -i src/shaders/shaders.glsl -o src/shaders/shaders.glsl.h -l metal_macos
          "$SHDC" -i modules/xvg/xvg_shaders.glsl -o src/shaders/xvg_shaders.glsl.h -l metal_macos

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCREAM_LITE_BUILD_STANDALONE=OFF

      - name: Build VST3
        run: cmake --build build --config Release --target ScreamLite_vst3
